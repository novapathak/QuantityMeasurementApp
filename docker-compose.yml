version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: quantity-measurement-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quantitymeasurementdb}
      MYSQL_USER: ${MYSQL_USER:-qm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qm_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - qm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Quantity Measurement App Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantity-measurement-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-quantitymeasurementdb}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-qm_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-qm_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-this-jwt-secret-to-a-long-random-value-for-production-1234567890}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-3600000}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-quantity-measurement-app}
      APP_DEFAULT_USERNAME: ${APP_DEFAULT_USERNAME:-admin}
      APP_DEFAULT_EMAIL: ${APP_DEFAULT_EMAIL:-admin@quantitymeasurement.local}
      APP_DEFAULT_FULL_NAME: ${APP_DEFAULT_FULL_NAME:-Default Admin}
      APP_DEFAULT_PASSWORD: ${APP_DEFAULT_PASSWORD:-Admin@12345}
      APP_DEFAULT_ROLES: ${APP_DEFAULT_ROLES:-USER}
      APP_DEFAULT_USER_ENABLED: ${APP_DEFAULT_USER_ENABLED:-true}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}
      GOOGLE_AUTHORIZED_REDIRECT_URI: ${GOOGLE_AUTHORIZED_REDIRECT_URI:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m -Xms256m}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qm_network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  qm_network:
    driver: bridge

