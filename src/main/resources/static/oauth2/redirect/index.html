<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Redirect</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="page-shell">
    <section class="panel">
        <div class="panel-header">
            <div>
                <p class="section-kicker">Authentication</p>
                <h2>Processing OAuth Response</h2>
            </div>
            <span class="status-pill muted">Redirecting</span>
        </div>
        <div class="result-card">
            <h3 id="redirectHeadline">Completing sign-in...</h3>
            <p id="redirectSummary">The frontend is storing the token returned by the backend.</p>
        </div>
    </section>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const error = params.get("error");
    const headline = document.getElementById("redirectHeadline");
    const summary = document.getElementById("redirectSummary");

    if (token) {
        localStorage.setItem("qm_token", token);
        headline.textContent = "OAuth login successful.";
        summary.textContent = "Redirecting back to the main app with the stored JWT.";
        window.setTimeout(() => window.location.replace("/"), 700);
    } else {
        headline.textContent = "OAuth login failed.";
        summary.textContent = error || "The backend did not provide a token.";
    }
</script>
</body>
</html>
